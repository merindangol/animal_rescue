{% extends 'base.html' %}
{% block title %}Apply to Adopt | PawConnect{% endblock %}
{% block content %}<main class="page">
    <div class="form-card">
        <h1>Apply to adopt {{ animal.name }}</h1>
        <p class="intro">Tell the rescue team why this animal would be a good fit for your home.</p>
        <form method="post">{% csrf_token %}{{ form.as_p }}<button class="primary-btn" type="submit">Submit
                application</button></form>
    </div>
</main>{% endblock %}

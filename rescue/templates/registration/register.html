{% extends 'base.html' %}
{% block title %}Sign Up | PawConnect{% endblock %}
{% block content %}<main class="page">
    <div class="form-card">
        <h1>Join PawConnect</h1>
        <p class="intro">Create an account to help animals find safety and care.</p>
        <form method="post">{% csrf_token %}{{ form.as_p }}<button class="primary-btn" type="submit">Create
                account</button></form>
        <p class="muted">Already registered? <a href="{% url 'login' %}">Log in</a>.</p>
    </div>
</main>{% endblock %}
